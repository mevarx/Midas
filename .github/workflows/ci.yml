name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l ./cmd ./internal ./apps)"
      - name: Build
        run: go build ./...
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Parse PowerShell completion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go run ./cmd/midas completion powershell | Out-File -Encoding utf8 "$env:RUNNER_TEMP/midas-completion.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:RUNNER_TEMP/midas-completion.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw $errors[0] }

  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: Run staticcheck
        run: staticcheck ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Run govulncheck
        run: govulncheck ./...

  shell-completions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install parsers
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Parse Bash, Zsh, and Fish completions
        run: |
          go run ./cmd/midas completion bash > "$RUNNER_TEMP/midas.bash"
          go run ./cmd/midas completion zsh > "$RUNNER_TEMP/_midas"
          go run ./cmd/midas completion fish > "$RUNNER_TEMP/midas.fish"
          bash -n "$RUNNER_TEMP/midas.bash"
          zsh -n "$RUNNER_TEMP/_midas"
          fish --no-execute "$RUNNER_TEMP/midas.fish"

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build every target
        run: |
          for goos in windows linux darwin; do
            for goarch in amd64 arm64; do
              echo "building $goos/$goarch"
              GOOS=$goos GOARCH=$goarch go build ./...
            done
          done
