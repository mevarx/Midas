name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l ./cmd ./internal ./apps)"
      - name: Build
        run: go build ./...
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build every target
        run: |
          for goos in windows linux darwin; do
            for goarch in amd64 arm64; do
              echo "building $goos/$goarch"
              GOOS=$goos GOARCH=$goarch go build ./...
            done
          done
