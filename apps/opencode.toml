id = "opencode"
name = "OpenCode"
homepage = "https://opencode.ai"
description = "Open-source AI coding agent for the terminal"

[process]
windows = ["opencode.exe"]
linux = ["opencode"]
darwin = ["opencode"]

[launch]
command = "opencode"

[[target]]
name = "data"
windows = "${XDG_DATA_HOME:-~/.local/share}/opencode"
linux = "${XDG_DATA_HOME:-~/.local/share}/opencode"
darwin = "${XDG_DATA_HOME:-~/.local/share}/opencode"
kind = "dir"

[[target]]
name = "config"
windows = "${XDG_CONFIG_HOME:-~/.config}/opencode"
linux = "${XDG_CONFIG_HOME:-~/.config}/opencode"
darwin = "${XDG_CONFIG_HOME:-~/.config}/opencode"
kind = "dir"

[[target]]
name = "cache"
windows = "${XDG_CACHE_HOME:-~/.cache}/opencode"
linux = "${XDG_CACHE_HOME:-~/.cache}/opencode"
darwin = "${XDG_CACHE_HOME:-~/.cache}/opencode"
kind = "dir"

[[target]]
name = "state"
windows = "${XDG_STATE_HOME:-~/.local/state}/opencode"
linux = "${XDG_STATE_HOME:-~/.local/state}/opencode"
darwin = "${XDG_STATE_HOME:-~/.local/state}/opencode"
kind = "dir"

[backup]
include = ["config.json", "auth.json", "*.md", "plugins/**", "skills/**"]
exclude = ["cache/**", "logs/**", "tmp/**", "**/node_modules/**", "*.log"]
max_file_mb = 50

[notes]
text = "OpenCode uses raw XDG paths on every OS: %USERPROFILE%\\.local\\share\\opencode on Windows and ~/.local/share/opencode on macOS — not AppData or Library/Application Support. opencode.db is SQLite with WAL sidecars; stop OpenCode and its server/desktop processes before moving. snapshot/ and repos/ hold git trees and can grow to many GB. Advisory locks live in the state target, so move data and state together."
